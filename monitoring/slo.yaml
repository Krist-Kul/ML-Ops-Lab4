# Lab 4 — service level objectives.
#
# Most students write a target and stop. The third field is where the thinking is: an SLO
# without a stated response to exhaustion is a wish, not an objective.
#
# Who consumes this service: maintenance planners reading a daily at-risk list, not a
# checkout page. A prediction that arrives an hour late costs nothing; a wrong one sends a
# technician to the wrong machine. That is why availability is modest, and why drift is
# alerted on at all.

service: itcs355-predict

objectives:
  - name: availability
    target: 0.995
    window: 30d
    measurement: "successful responses / total responses on /predict and /predict/batch, excluding 4xx"
    # 0.995 is 3.6 hours a month. Defended against what the deployment can actually do:
    # one replica, no autoscaling, a 37-42 s cold start (Lab 3), and a scripted rollback of
    # 36.6 s. A bad deploy caught and rolled back costs minutes, so this absorbs several;
    # 99.9% (43 min) would be spent by one slow incident on a single replica, and promising
    # it would mean buying a second replica (122 THB/day) for planners who would not notice.
    on_budget_exhausted: >
      Freeze every deploy that is not a rollback or a reliability fix — model versions
      included — until the 30-day budget recovers, and write a post-mortem naming which
      deploys spent it; if a provider outage spent it, record that and do not freeze,
      because a freeze cannot fix someone else's outage.

  - name: latency
    target_p95_ms: 200
    window: 7d
    measurement: "p95 of /predict, measured at the endpoint, not at the client"
    # Matches loadtest/k6.js: 200 ms is the end-to-end in-region promise stated there, and
    # "at the endpoint" is the platform's own latency, which includes its front door and
    # excludes the caller's internet. The k6 file's 50 ms is the CONTAINER's share of this
    # 200 — a component budget, and Lab 3 measured n1-standard-2 missing it (123.5 ms p95
    # container-side, ~135 ms projected in-region). So today the SLO is met and the
    # component budget is not; both facts are kept, neither is retargeted after the fact.
    on_budget_exhausted: >
      Check request rate against the 10.4 req/s one replica saturates at (Lab 3): if it is
      load, raise max_replicas to 2 at 5.09 THB/h, which is pre-approved; if it is not, freeze
      deploys and bisect the last image or model change — and never relax the 200 ms to fit.

  - name: freshness
    target_max_model_age_days: 30
    window: continuous
    measurement: "days since the production model version was trained"
    # Production is version 1, registered 2026-09-20: it breaches this on 2026-10-20. Lab 5's
    # retraining schedule must therefore run at most every 28 days (30, less two for a run
    # that fails and is retried), or this objective contradicts the pipeline that serves it.
    on_budget_exhausted: >
      Trigger the Lab 5 retraining pipeline, but promote only if the evaluation gate passes
      and the drift detector shows no schema or null-rate change in the new training window;
      if the gate fails, keep the stale model and log a dated waiver, because a fresh model
      trained on broken data is worse than an old one trained on good data.
